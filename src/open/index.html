<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light dark" />
    <title>UDB Aula Sync</title>
    <style>
      :root {
        color-scheme: light dark;
        --accent: #0b5cad;
        --soft: #e3eefb;
        --on: #fff;
        --error: #b3261e;
        font:
          13px/1.3 system-ui,
          -apple-system,
          Segoe UI,
          Roboto,
          sans-serif;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --accent: #7fb2ff;
          --soft: #1b2a44;
          --on: #0a1730;
          --error: #ff8a80;
        }
      }
      html,
      body {
        background: 0 0;
        margin: 0;
      }
      body {
        flex-wrap: wrap;
        align-items: center;
        gap: 6px;
        padding: 2px;
        display: flex;
      }
      button {
        all: unset;
        cursor: pointer;
        background: var(--soft);
        color: var(--accent);
        white-space: nowrap;
        border-radius: 999px;
        padding: 3px 11px;
        font-weight: 600;
      }
      button:hover {
        background: var(--accent);
        color: var(--on);
      }
      button:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      button[disabled] {
        opacity: 0.5;
        cursor: default;
      }
      #status {
        color: var(--error);
      }
    </style>
  </head>
  <body>
    <button id="open" type="button" disabled></button>
    <button id="show" type="button" disabled></button>
    <span id="status" role="status" aria-live="polite"></span>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
