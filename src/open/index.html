<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light dark" />
    <title>UDB Aula Sync</title>
    <style>
      :root {
        color-scheme: light dark;
        --accent: #0b5cad;
        --error: #a8201a;
        font:
          13px/1.3 system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          sans-serif;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --accent: #7db4ff;
          --error: #ff8a80;
        }
      }
      html,
      body {
        margin: 0;
        background: transparent;
      }
      body {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 6px;
        padding: 2px;
      }
      button {
        all: unset;
        cursor: pointer;
        padding: 2px 8px;
        border: 1px solid var(--accent);
        border-radius: 4px;
        color: var(--accent);
        white-space: nowrap;
      }
      button:hover {
        background: var(--accent);
        color: Canvas;
      }
      button:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      button[disabled] {
        opacity: 0.5;
        cursor: default;
      }
      #status {
        color: var(--error);
      }
    </style>
  </head>
  <body>
    <button id="open" type="button" disabled></button>
    <button id="show" type="button" disabled></button>
    <span id="status" role="status" aria-live="polite"></span>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
